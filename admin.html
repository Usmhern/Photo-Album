<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Upload Student</title>
    <style>
        body { background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        form { background: #222; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #333; color: white; border: none; }
        button { width: 100%; padding: 15px; background: #25D366; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <form id="uploadForm">
        <h3>Admin Upload</h3>
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="nickname" placeholder="Nickname" required>
        <input type="text" id="phone" placeholder="Phone (e.g. 234803...)" required>
        <input type="text" id="state" placeholder="State" required>
        <input type="text" id="lga" placeholder="Local Govt" required>
        <input type="text" id="address" placeholder="Residential Address" required>
        <input type="file" id="photoFile" accept="image/*" required>
        <button type="submit" id="submitBtn">UPLOAD TO ALBUM</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { /* SAME AS ABOVE */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Uploading...";
            btn.disabled = true;

            const file = document.getElementById('photoFile').files[0];
            const storageRef = ref(storage, 'students/' + Date.now() + "_" + file.name);

            try {
                // 1. Upload Photo
                const snapshot = await uploadBytes(storageRef, file);
                const url = await getDownloadURL(snapshot.ref);

                // 2. Save Details
                await addDoc(collection(db, "students"), {
                    name: document.getElementById('name').value,
                    nickname: document.getElementById('nickname').value,
                    phone: document.getElementById('phone').value,
                    state: document.getElementById('state').value,
                    lga: document.getElementById('lga').value,
                    address: document.getElementById('address').value,
                    imageUrl: url,
                    timestamp: serverTimestamp()
                });

                alert("Success!");
                location.reload();
            } catch (error) {
                alert("Error: " + error.message);
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
