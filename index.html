<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 2024 DIGITAL PHOTO ALBUM</title>
    
    <!-- External Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons for WhatsApp and Call buttons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="icon" type="image/jpg" href="https://nacos.org.ng/img/about.jpg">
    <script src="script.js" defer></script>

    <style>
      /* ======================================================
         GLOBAL THEME & CSS VARIABLES
         ====================================================== */
      :root {
          --bg-primary: #0a0c10;
          --bg-secondary: #121620;
          --bg-card: #181d2b;
          --accent-orange: #0be;
          --accent-orange-glow: rgba(0, 187, 255, 0.4);
          --whatsapp-green: #25d366;
          --whatsapp-green-hover: #1ebd56;
          --call-blue: #007bff;
          --call-blue-hover: #0056b3;
          --text-main: #f3f4f6;
          --text-muted: #9ca3af;
          --border-color: rgba(255, 255, 255, 0.08);
          --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
          background-color: var(--bg-primary);
          color: var(--text-main);
          font-family: 'Inter', sans-serif;
          min-height: 100vh;
          overflow-x: hidden;
      }

      body.intro-active { overflow: hidden; }

      /* ======================================================
         HEADER STRUCTURE
         ====================================================== */
      header { 
          position: relative; 
          top: 0; 
          width: 100%; 
          background: #000; 
          padding: 15px 10px; 
          text-align: center; 
          z-index: 1000; 
          display: flex; 
          flex-direction: column; 
          align-items: center;
      }

      header::after {
          content: "";
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 3px; 
          background: linear-gradient(90deg, #00bbff, navy, #000000, #00bbff, navy, black);
          background-size: 300% 100%;
          animation: moveGradient 2s linear infinite;
      }

      @keyframes moveGradient {
          0% { background-position: 0% 50%; }
          100% { background-position: 100% 50%; }
      }

      .nacos-logo-container {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid #fff;
          margin-bottom: 0.5rem;
      }

      .nacos-logo-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform: scale(1.8);
      }

      .album-header h1 {
          font-family: 'Rajdhani', sans-serif;
          font-size: clamp(1.5rem, 4vw, 2.5rem);
          font-weight: 700;
          color: var(--text-main);
          line-height: 1.2;
      }

      /* ======================================================
         SEARCH & FILTERS
         ====================================================== */
      .search-filter-container {
          max-width: 900px;
          margin: 1rem auto 1.5rem;
          padding: 1rem;
          background: var(--bg-secondary);
          border: 1px solid var(--border-color);
          border-radius: 12px;
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          gap: 0.75rem;
          align-items: flex-end;
      }

      .filter-group select, .filter-group input {
          width: 100%;
          padding: 0.5rem;
          background: var(--bg-primary);
          border: 1px solid var(--border-color);
          color: #fff;
          border-radius: 6px;
          font-size: 0.85rem;
      }

      /* ======================================================
         GALLERY GRID (STRICT 3-COLUMN LAYOUT ON ALL SCREENS)
         ====================================================== */
      .gallery-container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 0.5rem 4rem;
          display: grid;
          grid-template-columns: repeat(3, 1fr); /* 3 Columns on Mobile & Desktop */
          gap: 0.65rem;
      }

      @property --angle {
          syntax: "<angle>";
          inherits: false;
          initial-value: 0deg;
      }

      @keyframes borderRotate {
          to { --angle: 360deg; }
      }

      /* Glowing Animated Card */
      .photo-item {
          background-color: var(--bg-card);
          border-radius: 10px;
          overflow: hidden;
          transition: var(--transition-smooth);
          display: flex;
          flex-direction: column;
          border: 2px solid transparent;
          background:
              linear-gradient(#000, #000) padding-box,
              conic-gradient(
                  from var(--angle),
                  #000 0deg,
                  #000 250deg,
                  #0088ff 290deg,
                  #00bbff 315deg,
                  #0088ff 340deg,
                  #000 360deg
              ) border-box;
          animation: borderRotate 2.5s linear infinite;
      }

      .image-wrapper {
          position: relative;
          width: 100%;
          height: 140px;
          overflow: hidden;
          background: #000;
          cursor: pointer;
      }

      @media (min-width: 768px) {
          .image-wrapper { height: 260px; }
          .gallery-container { gap: 1.5rem; padding: 0 1.5rem 5rem; }
      }

      .image-wrapper img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
          transition: var(--transition-smooth);
      }

      .photo-item:hover .image-wrapper img {
          transform: scale(1.05);
      }

      .card-content {
          padding: 0.5rem;
          display: flex;
          flex-direction: column;
          flex-grow: 1;
          text-align: center;
      }

      .card-content h3 {
          font-family: 'Rajdhani', sans-serif;
          font-size: 0.85rem;
          color: var(--text-main);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }

      .card-content .player-title {
          color: var(--accent-orange);
          font-size: 0.7rem;
          font-weight: 600;
          margin-bottom: 0.35rem;
      }

      /* Call & Chat Action Buttons directly beneath photo */
      .card-actions {
          display: flex;
          gap: 0.35rem;
          margin-top: auto;
      }

      .btn-action {
          flex: 1;
          padding: 0.4rem 0.2rem;
          font-size: 0.75rem;
          font-weight: 600;
          border-radius: 6px;
          border: none;
          color: #fff;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 0.25rem;
          text-decoration: none;
          cursor: pointer;
          transition: var(--transition-smooth);
      }

      .btn-chat { background-color: var(--whatsapp-green); }
      .btn-chat:hover { background-color: var(--whatsapp-green-hover); }

      .btn-call { background-color: var(--call-blue); }
      .btn-call:hover { background-color: var(--call-blue-hover); }

      /* ======================================================
         GLOWING PREVIEW LIGHTBOX MODAL
         ====================================================== */
      .modal {
          display: none;
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0, 0, 0, 0.9);
          z-index: 10000;
          align-items: center;
          justify-content: center;
          padding: 1rem;
      }

      .preview-modal-content {
          position: relative;
          max-width: 90vw;
          max-height: 85vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 6px;
          border-radius: 14px;
          border: 3px solid transparent;
          background:
              linear-gradient(#000, #000) padding-box,
              conic-gradient(
                  from var(--angle),
                  #000 0deg,
                  #000 250deg,
                  #0088ff 290deg,
                  #00bbff 315deg,
                  #0088ff 340deg,
                  #000 360deg
              ) border-box;
          animation: borderRotate 2s linear infinite;
          box-shadow: 0 0 30px rgba(0, 187, 255, 0.3);
      }

      .preview-modal-content img {
          max-width: 100%;
          max-height: 70vh;
          border-radius: 8px;
          object-fit: contain;
      }

      .preview-caption {
          margin-top: 10px;
          color: #fff;
          font-size: 1.1rem;
          font-family: 'Rajdhani', sans-serif;
          font-weight: 700;
          text-align: center;
      }

      .close-modal {
          position: absolute;
          top: -12px;
          right: -12px;
          background: #000;
          border: 2px solid var(--accent-orange);
          color: #fff;
          width: 32px;
          height: 32px;
          border-radius: 50%;
          font-size: 1.2rem;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 10001;
      }

      /* Floating WhatsApp Live Chat Trigger */
      #chatToggleBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: var(--whatsapp-green);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        z-index: 999;
        display: flex;
        align-items: center;
        gap: 6px;
      }
    </style>
</head>
<body>

    <!-- Main Header -->
    <header class="album-header">
        <div class="nacos-logo-container">
            <img src="https://nacos.org.ng/img/about.jpg" alt="NACOS Logo" class="nacos-logo-img">
        </div>
        <h1><span style="color:#0be;">YOBE STATE UNIVERSITY</span></h1>
        <p style="font-size: 0.85rem; color:#aaa;">CS 2K24 DIGITAL PHOTO ALBUM</p>
    </header>

    <!-- Filters Section -->
    <section class="search-filter-container">
        <div class="filter-group">
            <select id="filter-state" onchange="onFilterStateChange()">
                <option value="">Filter State</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="filter-lga" onchange="applyLocationFilter()" disabled>
                <option value="">Filter LGA</option>
            </select>
        </div>
    </section>

    <!-- 3-Column Grid Container (Applies to Mobile & Desktop) -->
    <main class="gallery-container" id="gallery-grid">
        <!-- Sample Dynamic Member Card 1 -->
        <div class="photo-item">
            <div class="image-wrapper" onclick="openImagePreview('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500', 'Amina Usman - Class Rep')">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" alt="Member Photo">
            </div>
            <div class="card-content">
                <h3>Amina Usman</h3>
                <div class="player-title">Class Rep</div>
                <div class="card-actions">
                    <a href="tel:08012345678" class="btn-action btn-call">
                        <i class="fa-solid fa-phone"></i> Call
                    </a>
                    <a href="https://wa.me/2348012345678" target="_blank" class="btn-action btn-chat">
                        <i class="fa-brands fa-whatsapp"></i> Chat
                    </a>
                </div>
            </div>
        </div>

        <!-- Sample Dynamic Member Card 2 -->
        <div class="photo-item">
            <div class="image-wrapper" onclick="openImagePreview('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500', 'Ibrahim Bello - Engr.')">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500" alt="Member Photo">
            </div>
            <div class="card-content">
                <h3>Ibrahim Bello</h3>
                <div class="player-title">Engr.</div>
                <div class="card-actions">
                    <a href="tel:08087654321" class="btn-action btn-call">
                        <i class="fa-solid fa-phone"></i> Call
                    </a>
                    <a href="https://wa.me/2348087654321" target="_blank" class="btn-action btn-chat">
                        <i class="fa-brands fa-whatsapp"></i> Chat
                    </a>
                </div>
            </div>
        </div>

        <!-- Sample Dynamic Member Card 3 -->
        <div class="photo-item">
            <div class="image-wrapper" onclick="openImagePreview('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500', 'Usman Muhammad - Tech Lead')">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500" alt="Member Photo">
            </div>
            <div class="card-content">
                <h3>Usman M.</h3>
                <div class="player-title">Tech Lead</div>
                <div class="card-actions">
                    <a href="tel:08099887766" class="btn-action btn-call">
                        <i class="fa-solid fa-phone"></i> Call
                    </a>
                    <a href="https://wa.me/2348099887766" target="_blank" class="btn-action btn-chat">
                        <i class="fa-brands fa-whatsapp"></i> Chat
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Glowing Border Image Preview Lightbox Modal -->
    <div id="preview-modal" class="modal" onclick="closePreviewModal()">
        <div class="preview-modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closePreviewModal()">&times;</button>
            <img id="preview-img" src="" alt="Preview">
            <div id="preview-caption" class="preview-caption"></div>
            <audio id="BSound" preload="auto">
                <source src="https://raw.githubusercontent.com/Usmhern/Photo-Album/main/hw.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- Live Chat Trigger Button -->
    <button id="chatToggleBtn">
      <i class="fa-brands fa-whatsapp" style="font-size:1.1rem;"></i> Live Chat
    </button>

    <script>
      // Function to open the image modal preview with glowing borders & sound
      function openImagePreview(imgSrc, captionText) {
        var modal = document.getElementById("preview-modal");
        var img = document.getElementById("preview-img");
        var caption = document.getElementById("preview-caption");
        var audio = document.getElementById("BSound");

        if (img) img.src = imgSrc;
        if (caption) caption.innerText = captionText || "";
        if (modal) modal.style.display = "flex";

        if (audio) {
          audio.currentTime = 0;
          audio.play().catch(function(e) { console.log("Audio play allowed on user action:", e); });
        }
      }

      function closePreviewModal() {
        var modal = document.getElementById("preview-modal");
        if (modal) modal.style.display = "none";
      }
    </script>
</body>
</html>
