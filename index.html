<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 2024 Digital Photo Album & Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #121620;
            --bg-card: #181d2b;
            --accent-orange: #ff5500;
            --accent-orange-glow: rgba(255, 85, 0, 0.4);
            --whatsapp-green: #25d366;
            --whatsapp-green-hover: #1ebd56;
            --call-blue: #007bff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* NACOS Header & Logo Section */
        .album-header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

      .nacos-logo-container {
    width: 90px;                  /* Fixed width */
    height: 90px;                 /* Same height ensures a 1:1 ratio */
    border-radius: 50%;           /* Makes the container circular */
    overflow: hidden;             /* Clips image overflow outside the circle */
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;    /* Optional accent border */
}

.nacos-logo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;            /* Fills the circle without distorting ratio */
}

        .album-header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .album-header .highlight {
            color: var(--accent-orange);
            text-shadow: 0 0 20px var(--accent-orange-glow);
        }

        /* Top Action Bar */
        .admin-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 0 1rem;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.65rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .photo-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
        }

        .photo-item:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 85, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .photo-item:hover .image-wrapper img {
            transform: scale(1.05);
        }

        .image-overlay-hint {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition-smooth);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .image-wrapper:hover .image-overlay-hint {
            opacity: 1;
        }

        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-content h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.35rem;
            color: var(--text-main);
        }

        .card-content .player-title {
            color: var(--accent-orange);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .card-content .location-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Action Buttons Grid */
        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
            padding-top: 1rem;
        }

        .whatsapp-btn, .call-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.6rem 0.4rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            transition: var(--transition-smooth);
        }

        .whatsapp-btn {
            background-color: rgba(37, 211, 102, 0.1);
            color: var(--whatsapp-green);
            border: 1px solid rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background-color: var(--whatsapp-green);
            color: #fff;
        }

        .call-btn {
            background-color: rgba(0, 123, 255, 0.1);
            color: var(--call-blue);
            border: 1px solid rgba(0, 123, 255, 0.3);
        }

        .call-btn:hover {
            background-color: var(--call-blue);
            color: #fff;
        }

        /* Modal Overlay System */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            font-family: 'Rajdhani', sans-serif;
            margin-bottom: 1.25rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: #fff;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.25rem;
            cursor: pointer;
        }
        
        .delete-btn {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid rgba(255, 0, 0, 0.4);
            padding: 0.3rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .admin-manage-item {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.5rem 0; 
            border-bottom: 1px solid var(--border-color);
        }

        /* Image Preview Lightbox */
        .preview-modal-content {
            background: transparent;
            border: none;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .preview-modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
            object-fit: contain;
        }

        .preview-caption {
            margin-top: 1rem;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
            color: var(--text-main);
        }

        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: 1fr;
                padding: 0 1rem 3rem;
            }
            .modal-content {
                padding: 1.25rem;
            }
            .action-btns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

  <header class="album-header">
        <!-- Circular NACOS Logo -->
        <div class="nacos-logo-container" title="Nigeria Association of Computer Science Students">
            <img src="https://nacos.org.ng/img/about.jpg" alt="NACOS Logo" class="nacos-logo-img">
        </div>
        <h1>CS <span class="highlight">2K24</span> DIGITAL PHOTO ALBUM</h1>
    </header>

    <div class="admin-bar">
        <button class="btn btn-primary" onclick="checkAdminAccess()">🔒 Central Admin Panel</button>
        <button class="btn" id="logout-btn" style="display:none;" onclick="adminLogout()">🔓 Logout Admin</button>
    </div>

    <!-- Gallery Grid Container -->
    <main class="gallery-container" id="gallery-grid"></main>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Admin Authentication</h2>
            <div class="form-group">
                <label for="admin-pass">Admin Passcode</label>
                <input type="password" id="admin-pass" placeholder="Enter code (default: admin123)">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Central Admin Dashboard</h2>
            
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem;">
                <h3 style="font-size: 1.1rem; margin-bottom: 0.75rem;">Add New Memory / Member</h3>
                <div class="form-group">
                    <label for="input-file">Upload Picture from Device</label>
                    <input type="file" id="input-file" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="input-name">Person's Name / Milestone Title</label>
                    <input type="text" id="input-name" placeholder="e.g. s1mple / 20k Elo">
                </div>
                <div class="form-group">
                    <label for="input-title">Title / Role</label>
                    <input type="text" id="input-title" placeholder="e.g. Entry Fragger / Team Captain">
                </div>
                <div class="form-group">
                    <label for="input-phone">WhatsApp Phone Number</label>
                    <input type="text" id="input-phone" placeholder="e.g. +2348012345678">
                </div>
                
                <!-- State Selector -->
                <div class="form-group">
                    <label for="input-state">Select State</label>
                    <select id="input-state" onchange="handleStateChange()">
                        <option value="">-- Choose State --</option>
                    </select>
                </div>
                
                <!-- LGA Selector (Cascading) -->
                <div class="form-group" id="lga-container" style="display:none;">
                    <label for="input-lga">Select Local Government Area (LGA)</label>
                    <select id="input-lga">
                        <option value="">-- Choose LGA --</option>
                    </select>
                </div>

                <button class="btn btn-primary" id="publish-btn" onclick="addPhotoEntry()">Publish to Album</button>
            </div>

            <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Existing Entries (Manage)</h3>
            <div id="admin-manage-list" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Image Preview Lightbox Modal -->
    <div id="preview-modal" class="modal" onclick="closeModals()">
        <div class="preview-modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <img id="preview-img" src="" alt="Preview">
            <div id="preview-caption" class="preview-caption"></div>
        </div>
    </div>

    let galleryData = JSON.parse(localStorage.getItem('cs2_album_data')) || [];

    function populateStates() {
        const stateSelect = document.getElementById('input-state');
        stateSelect.innerHTML = '<option value="">-- Choose State --</option>';
        Object.keys(nigeriaStatesAndLgas).sort().forEach(state => {
            const opt = document.createElement('option');
            opt.value = state;
            opt.textContent = state;
            stateSelect.appendChild(opt);
        });
    }

    function handleStateChange() {
        const stateSelect = document.getElementById('input-state');
        const lgaContainer = document.getElementById('lga-container');
        const lgaSelect = document.getElementById('input-lga');
        const selectedState = stateSelect.value;

        if (selectedState && nigeriaStatesAndLgas[selectedState]) {
            lgaSelect.innerHTML = '<option value="">-- Choose LGA --</option>';
            nigeriaStatesAndLgas[selectedState].forEach(lga => {
                const opt = document.createElement('option');
                opt.value = lga;
                opt.textContent = lga;
                lgaSelect.appendChild(opt);
            });
            lgaContainer.style.display = 'block';
        } else {
            lgaContainer.style.display = 'none';
            lgaSelect.innerHTML = '<option value="">-- Choose LGA --</option>';
        }
    }

    function previewImage(src, name) {
        const modal = document.getElementById('preview-modal');
        const img = document.getElementById('preview-img');
        const caption = document.getElementById('preview-caption');
        img.src = src;
        caption.textContent = name;
        modal.classList.add('active');
    }

    // 2. REPLACED AND ENHANCED: Fetch online photos from Web App & Render UI
    async function fetchAndRenderGallery() {
        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '<p style="color:#fff; text-align:center;">Loading shared album...</p>';

        try {
            const response = await fetch(WEB_APP_URL);
            const remoteData = await response.json();

            // Merge server response into local data if returned as array
            if (Array.isArray(remoteData) && remoteData.length > 0) {
                galleryData = remoteData;
                localStorage.setItem('cs2_album_data', JSON.stringify(galleryData));
            }
        } catch (error) {
            console.warn("Could not fetch remote album data, loading cached entries:", error);
        }

        grid.innerHTML = '';

        if (galleryData.length === 0) {
            grid.innerHTML = '<p style="color:#fff; text-align:center;">No photos uploaded yet.</p>';
            return;
        }

        galleryData.forEach((item) => {
            const cleanPhone = (item.phone || '').replace(/[^0-9+]/g, '');
            const waLink = `https://wa.me/${cleanPhone}`;
            const callLink = `tel:${cleanPhone}`;

            const article = document.createElement('article');
            article.className = 'photo-item';

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'image-wrapper';
            imgWrapper.onclick = () => previewImage(item.img || item.url, item.name);

            const img = document.createElement('img');
            img.src = item.img || item.url;
            img.alt = item.name || 'Album Image';
            img.loading = 'lazy';
            
            img.onerror = function() {
                this.onerror = null;
                this.src = "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80";
            };

            const overlay = document.createElement('div');
            overlay.className = 'image-overlay-hint';
            overlay.textContent = '🔍 Click to Preview';

            imgWrapper.appendChild(img);
            imgWrapper.appendChild(overlay);

            const cardContent = document.createElement('div');
            cardContent.className = 'card-content';

            const playerTitle = document.createElement('div');
            playerTitle.className = 'player-title';
            playerTitle.textContent = item.title || 'Member';

            const nameHeader = document.createElement('h3');
            nameHeader.textContent = item.name || 'Anonymous';

            const locationTag = document.createElement('div');
            locationTag.className = 'location-tag';
            if (item.state && item.lga) {
                locationTag.textContent = `📍 ${item.lga}, ${item.state}`;
            } else if (item.state) {
                locationTag.textContent = `📍 ${item.state}`;
            }

            const actionBtns = document.createElement('div');
            actionBtns.className = 'action-btns';

            const waAnchor = document.createElement('a');
            waAnchor.href = waLink;
            waAnchor.target = '_blank';
            waAnchor.rel = 'noopener noreferrer';
            waAnchor.className = 'whatsapp-btn';
            waAnchor.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/>
                </svg> Chat
            `;

            const callAnchor = document.createElement('a');
            callAnchor.href = callLink;
            callAnchor.className = 'call-btn';
            callAnchor.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg> Call

            cardContent.appendChild(nameHeader);

    function checkAdminAccess() {
        if (isAdminLoggedIn) {
            openAdminDashboard();
        } else {
            document.getElementById('login-modal').classList.add('active');
        }
    }

    function verifyAdmin() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'admin123') {
            isAdminLoggedIn = true;
            document.getElementById('logout-btn').style.display = 'inline-block';
            document.getElementById('admin-pass').value = '';
            closeModals();
            openAdminDashboard();
        } else {
            alert('Incorrect Admin Passcode!');
        }
    }

    function adminLogout() {
        isAdminLoggedIn = false;
        document.getElementById('logout-btn').style.display = 'none';
        alert('Logged out of Admin panel.');
    }

    function openAdminDashboard() {
        document.getElementById('admin-modal').classList.add('active');
        renderAdminManageList();
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }

    async function addPhotoEntry() {
        const fileInput = document.getElementById('input-file');
        const nameInput = document.getElementById('input-name');
        const titleInput = document.getElementById('input-title');
        const phoneInput = document.getElementById('input-phone');
        const stateInput = document.getElementById('input-state');
        const lgaInput = document.getElementById('input-lga');
        const publishBtn = document.getElementById('publish-btn');

        if (fileInput.files.length === 0 || !nameInput.value.trim() || !phoneInput.value.trim()) {
            alert('Please select an image file, enter a name, and provide a phone number!');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        publishBtn.disabled = true;
        publishBtn.textContent = "Uploading...";

        reader.onload = async function(e) {
            const base64String = e.target.result.split(',')[1];
            
            const payload = {
                filename: file.name,
                mimeType: file.type,
                bytes: base64String,
                name: nameInput.value.trim(),
                title: titleInput.value.trim() || 'Member',
                phone: phoneInput.value.trim(),
                state: stateInput.value || '',
                lga: lgaInput.value || ''
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    let directImgUrl = result.url;
                    if (directImgUrl.includes("drive.google.com")) {
                        const fileIdMatch = directImgUrl.match(/\/d\/(.*?)\//);
                        if (fileIdMatch && fileIdMatch[1]) {
                            directImgUrl = `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}=s1000`;
                        }
                    }

                    galleryData.push({ 
                        img: directImgUrl, 
                        name: nameInput.value.trim(), 
                        title: titleInput.value.trim() || 'Member', 
                        phone: phoneInput.value.trim(),
                        state: stateInput.value || '',
                        lga: lgaInput.value || ''
                    });

                    localStorage.setItem('cs2_album_data', JSON.stringify(galleryData));
                    fetchAndRenderGallery();
                    renderAdminManageList();

                    fileInput.value = '';
                    nameInput.value = '';
                    titleInput.value = '';
                    phoneInput.value = '';
                    stateInput.value = '';
                    lgaInput.value = '';
                    document.getElementById('lga-container').style.display = 'none';

                    alert('Success! Image saved to Google Drive and published.');
                } else {
                    alert('Upload failed: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred during upload. Check console for details.');
            } finally {
                publishBtn.disabled = false;
                publishBtn.textContent = "Publish to Album";
            }
        };

        reader.readAsDataURL(file);
    }

    function renderAdminManageList() {
        const list = document.getElementById('admin-manage-list');
        list.innerHTML = '';
        
        galleryData.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'admin-manage-item';

            const span = document.createElement('span');
            const locInfo = item.state ? ` - ${item.state}` : '';
            span.textContent = `${item.name} (${item.title}${locInfo})`;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.textContent = 'Delete';
            delBtn.onclick = () => deleteEntry(index);

            div.appendChild(span);
            div.appendChild(delBtn);
            list.appendChild(div);
        });
    }

    function deleteEntry(index) {
        if (confirm('Are you sure you want to delete this entry?')) {
            galleryData.splice(index, 1);
            localStorage.setItem('cs2_album_data', JSON.stringify(galleryData));
            fetchAndRenderGallery();
            renderAdminManageList();
        }
    }

    // 3. Page load trigger replaces standard initial execution
    document.addEventListener("DOMContentLoaded", () => {
        populateStates();
        fetchAndRenderGallery();
    });
</script>
