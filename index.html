<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 2024 Digital Photo Album & Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #121620;
            --bg-card: #181d2b;
            --accent-orange:/* #ff5500;*/ #0be;
            --accent-orange-glow: rgba(255, 85, 0, 0.4);
            --whatsapp-green: #25d366;
            --whatsapp-green-hover: #1ebd56;
            --call-blue: #007bff;
            --danger-red: #ff3b30;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

     /*   .album-header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }*/

        header { 
    position: relative; 
    top: 0; 
    width: 100%; 
    background: #000; 
    padding: 15px 10px; 
    text-align: center; 
    z-index: 1000; 
    display: flex; 
    flex-direction: column; 
    align-items: center;
    border-bottom: none; /* Remove any existing solid border */
}

/* This creates the continuous moving border at the bottom */
header::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px; 
    background: linear-gradient(90deg, #00bbff, navy, #000000, #00bbff,navy, black);
    background-size: 300% 100%;
    animation: moveGradient 2s linear infinite;
}

        @keyframes moveGradient {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 100% 50%;
    }
               }
        

        .nacos-logo-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #fff;
            margin-bottom: 1rem;
        }

          .nacos-logo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.9);
        object-position: center;   /* Keeps the focal point dead center */
  transform-origin: center center;
    }




        .album-header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .album-header .highlight {
            color: var(--accent-orange);
            text-shadow: 0 0 20px var(--accent-orange-glow);
        }

        .admin-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 0 1rem;
            flex-wrap: wrap;
        }

        /* Filter Search Section */
        .search-filter-container {
            max-width: 900px;
            margin: 0 auto 2.5rem;
            padding: 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }

        .filter-group select option {
            background: var(--bg-secondary);
            color: #fff;
        }

        .btn {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.65rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-primary {
            background-color: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        .btn-reset {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        .btn-reset:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn-edit {
            background: rgba(0, 123, 255, 0.2);
            color: #4da6ff;
            border: 1px solid rgba(0, 123, 255, 0.4);
            padding: 0.35rem 0.65rem;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-edit:hover {
            background: var(--call-blue);
            color: #fff;
        }

        .btn-delete {
            background: rgba(255, 59, 48, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 59, 48, 0.4);
            padding: 0.35rem 0.65rem;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete:hover {
            background: var(--danger-red);
            color: #fff;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 3rem;
        }

        .photo-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
        }

        .photo-item:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 85, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        /* Top alignment for all member pictures */
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: var(--transition-smooth);
        }

        .photo-item:hover .image-wrapper img {
            transform: scale(1.05);
        }

        .image-overlay-hint {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: var(--transition-smooth);
            color: #fff;
            font-size: 0.83rem;
            font-weight: 600;
        }

        .image-wrapper:hover .image-overlay-hint {
            opacity: 1;
        }

        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-content h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.35rem;
            color: var(--text-main);
        }

        .card-content .player-title {
            color: var(--accent-orange);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .card-content .location-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
            padding-top: 1rem;
        }

        .whatsapp-btn, .call-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0.6rem 0.4rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            transition: var(--transition-smooth);
        }

        .whatsapp-btn {
            background-color: rgba(37, 211, 102, 0.1);
            color: var(--whatsapp-green);
            border: 1px solid rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background-color: var(--whatsapp-green);
            color: #fff;
        }

        .call-btn {
            background-color: rgba(0, 123, 255, 0.1);
            color: var(--call-blue);
            border: 1px solid rgba(0, 123, 255, 0.3);
        }

        .call-btn:hover {
            background-color: var(--call-blue);
            color: #fff;
        }

        .btn-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            font-family: 'Rajdhani', sans-serif;
            margin-bottom: 1.25rem;
            font-size: 1.5rem;
        }

        .edit-preview-box {
            text-align: center;
            margin-bottom: 1.25rem;
            padding: 0.75rem;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .edit-preview-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            object-position: top center;
            border-radius: 50%;
            border: 2px solid var(--accent-orange);
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: #fff;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .admin-manage-item {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.65rem 0; 
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        .admin-item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preview-modal-content {
            background: transparent;
            border: none;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .preview-modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
            object-fit: contain;
        }

        .preview-caption {
            margin-top: 1rem;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.25rem;
            color: var(--text-main);
        }

        .loading-text {
            text-align: center;
            grid-column: 1 / -1;
            padding: 2rem;
            color: var(--text-muted);
        }

      @media (max-width: 768px) {
            .search-filter-container {
                grid-template-columns: 1fr;
            }
        }

        /* 📱 MOBILE VIEW: 3 COLUMNS & COMPACT STYLING */
        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.4rem;
                padding: 0 0.4rem 3rem;
            }
            .photo-item {
                border-radius: 6px;
            }

            .image-wrapper {
                height: 110px;
            }

            .card-content {
                padding: 0.4rem;
            }

            .card-content h3 {
                font-size: 0.75rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .card-content .player-title {
                font-size: 0.6rem;
                margin-bottom: 0.15rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .card-content .location-tag {
                font-size: 0.55rem;
                margin-bottom: 0.3rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .action-btns {
                grid-template-columns: 1fr;
                gap: 4px;
                padding-top: 0.3rem;
            }

            .whatsapp-btn, .call-btn {
                padding: 0.3rem 0.2rem;
                font-size: 0.62rem;
                border-radius: 4px;
            }

            .btn-icon {
                width: 11px;
                height: 11px;
            }

            .modal-content {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <header class="album-header">
        <div class="nacos-logo-container" title="Nigeria Association of Computer Science Students">
            <img src="https://nacos.org.ng/img/about.jpg" alt="NACOS Logo" class="nacos-logo-img">
        </div>
        <h1>CS <span class="highlight" style="color:#0be">2K24</span> DIGITAL PHOTO ALBUM</h1>
    </header>

    <div class="admin-bar">
        <button class="btn btn-primary" onclick="checkAdminAccess()"> Central Admin Panel</button>
        <button class="btn" id="logout-btn" style="display:none;" onclick="adminLogout()"> Logout Admin</button>
    </div>

    <!-- Location Search & Filter Bar -->
    <section class="search-filter-container">
        <center> <label for="filter-state">FILTER BY STATE AND LGA</label></center>
        <div class="filter-group">
           
            <select id="filter-state" onchange="onFilterStateChange()">
                <option value="">STATES</option>
            </select>
        </div>

        <div class="filter-group">
           
            <select id="filter-lga" onchange="applyLocationFilter()" disabled>
                <option value="">LGA</option>
            </select>
        </div>

       <center> <button class="btn btn-reset" onclick="resetFilters()" style="background:#0be; color:black;">SHOW ALL</button></center>
    </section>

    <!-- Gallery Grid Container -->
    <main class="gallery-container" id="gallery-grid">
        <div class="loading-text">Loading album memories...</div>
    </main>

    <!-- Admin Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Admin Authentication</h2>
            <div class="form-group">
                <label for="admin-pass">Admin Passcode</label>
                <input type="password" id="admin-pass" placeholder="Enter code (default: admin123)">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Central Admin Dashboard</h2>
            
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem;">
                <h3 style="font-size: 1.1rem; margin-bottom: 0.75rem;">Add New Memory / Member</h3>
                <div class="form-group">
                    <label for="input-file">Upload Picture from Device</label>
                    <input type="file" id="input-file" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="input-name">Person's Name / Milestone Title</label>
                    <input type="text" id="input-name" placeholder="e.g. s1mple / 20k Elo">
                </div>
                <div class="form-group">
                    <label for="input-title">Title / Role</label>
                    <input type="text" id="input-title" placeholder="e.g. Entry Fragger / Team Captain">
                </div>
                <div class="form-group">
                    <label for="input-phone">WhatsApp Phone Number</label>
                    <input type="text" id="input-phone" placeholder="e.g. 08012345678">
                </div>
                
                <div class="form-group">
                    <label for="input-state">Select State</label>
                    <select id="input-state" onchange="handleStateChange('input-state', 'lga-container', 'input-lga')">
                        <option value="">-- Choose State --</option>
                    </select>
                </div>
                
                <div class="form-group" id="lga-container" style="display:none;">
                    <label for="input-lga">Select Local Government Area (LGA)</label>
                    <select id="input-lga">
                        <option value="">-- Choose LGA --</option>
                    </select>
                </div>

                <button class="btn btn-primary" id="publish-btn" onclick="addPhotoEntry()">Publish to Album</button>
              </div>

            <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Existing Entries (Manage & Edit)</h3>
            <div id="admin-manage-list" style="max-height: 250px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Edit Member Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
            <h2>Edit Member Information</h2>
            
            <div class="edit-preview-box">
                <img id="edit-preview-img" class="edit-preview-img" src="" alt="Member Image">
                <div id="edit-preview-name" style="font-weight: 700; color: var(--text-main);"></div>
            </div>

            <input type="hidden" id="edit-row-id">
            <input type="hidden" id="edit-index">
            
            <!-- Replace Image Input -->
            <div class="form-group">
                <label for="edit-file">Replace Member Photo (Optional)</label>
                <input type="file" id="edit-file" accept="image/*" onchange="previewNewEditImage(this)">
            </div>

            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label for="edit-title">Nickname</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label for="edit-phone">Phone Number</label>
                <input type="text" id="edit-phone">
            </div>
            <div class="form-group">
                <label for="edit-state">State</label>
                <select id="edit-state" onchange="handleStateChange('edit-state', 'edit-lga-container', 'edit-lga')">
                    <option value="">-- Choose State --</option>
                </select>
            </div>
            <div class="form-group" id="edit-lga-container" style="display:none;">
                <label for="edit-lga">LGA</label>
                <select id="edit-lga">
                    <option value="">-- Choose LGA --</option>
                </select>
            </div>
            
            <button class="btn btn-primary" id="save-edit-btn" style="width:100%;" onclick="saveMemberEdit()">Save Changes</button>
        </div>
    </div>

    <!-- Image Preview Lightbox Modal -->
    <div id="preview-modal" class="modal" onclick="closeModals()">
        <div class="preview-modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <img id="preview-img" src="" alt="Preview">
            <div id="preview-caption" class="preview-caption"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzo7FOW_vAVEgqgc6vEAKCetxoc_sRU1uIWZhM1HppRAmEn4kOg4_n4k6LAOl_HKT8/exec";

        async function fetchGalleryData() {
            try {
                const response = await fetch(WEB_APP_URL);
                galleryData = await response.json();
                renderGallery(galleryData);
            } catch (err) {
                console.error("Error fetching data:", err);
                document.getElementById('gallery-grid').innerHTML = '<div class="loading-text">Failed to load memories.</div>';
            }
        }

        function populateStateOptions(selectId) {
            const stateSelect = document.getElementById(selectId);
            stateSelect.innerHTML = selectId === 'filter-state' ? '<option value="">STATES</option>' : '<option value="">-- Choose State --</option>';
            
            Object.keys(nigeriaStatesAndLgas).sort().forEach(state => {
                const opt = document.createElement('option');
                opt.value = state;
                opt.textContent = state;
                stateSelect.appendChild(opt);
            });
        }

        function handleStateChange(stateSelectId, lgaContainerId, lgaSelectId) {
            const stateSelect = document.getElementById(stateSelectId);
            const lgaContainer = document.getElementById(lgaContainerId);
            const lgaSelect = document.getElementById(lgaSelectId);
            const selectedState = stateSelect.value;

            if (selectedState && nigeriaStatesAndLgas[selectedState]) {
                lgaSelect.innerHTML = '<option value="">-- Choose LGA --</option>';
                nigeriaStatesAndLgas[selectedState].forEach(lga => {
                    const opt = document.createElement('option');
                    opt.value = lga;
                    opt.textContent = lga;
                    lgaSelect.appendChild(opt);
                });
                lgaContainer.style.display = 'block';
            } else {
                lgaContainer.style.display = 'none';
                lgaSelect.innerHTML = '<option value="">-- Choose LGA --</option>';
            }
        }

        /* --- Filter Search Bar Functions --- */
        function onFilterStateChange() {
            const selectedState = document.getElementById('filter-state').value;
            const lgaSelect = document.getElementById('filter-lga');

            if (selectedState && nigeriaStatesAndLgas[selectedState]) {
                lgaSelect.innerHTML = '<option value="">-- All Local Governments --</option>';
                nigeriaStatesAndLgas[selectedState].forEach(lga => {
                    const opt = document.createElement('option');
                    opt.value = lga;
                    opt.textContent = lga;
                    lgaSelect.appendChild(opt);
                });
                lgaSelect.disabled = false;
            } else {
                lgaSelect.innerHTML = '<option value="">-- Select State First --</option>';
                lgaSelect.disabled = true;
            }

            applyLocationFilter();
        }

        function applyLocationFilter() {
            const selectedState = document.getElementById('filter-state').value;
            const selectedLga = document.getElementById('filter-lga').value;

            let filtered = galleryData;

            if (selectedState) {
                filtered = filtered.filter(item => (item.state || '').toLowerCase() === selectedState.toLowerCase());
            }

            if (selectedLga) {
                filtered = filtered.filter(item => (item.lga || '').toLowerCase() === selectedLga.toLowerCase());
            }

            renderGallery(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-state').value = '';
            const lgaSelect = document.getElementById('filter-lga');
            lgaSelect.innerHTML = '<option value="">-- Select State First --</option>';
            lgaSelect.disabled = true;

            renderGallery(galleryData);
        }

        function renderGallery(dataToRender = galleryData) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            if (!Array.isArray(dataToRender) || dataToRender.length === 0) {
                grid.innerHTML = '<div class="loading-text">No members found matching this location!</div>';
                return;
            }

            dataToRender.forEach((item) => {
                const phoneStr = String(item.phone || '');
                const cleanPhone = phoneStr.replace(/[^0-9+]/g, '');
                
                const waLink = cleanPhone ? `https://wa.me/${cleanPhone}` : '#';
                const callLink = cleanPhone ? `tel:${cleanPhone}` : '#';

                const article = document.createElement('article');
                article.className = 'photo-item';

                const imgWrapper = document.createElement('div');
                imgWrapper.className = 'image-wrapper';
                imgWrapper.onclick = () => previewImage(item.img, item.name);

                const img = document.createElement('img');
                img.src = item.img;
                img.alt = item.name;
                img.loading = 'lazy';
                
                img.onerror = function() {
                    this.onerror = null;
                    this.src = "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80";
                };

                const overlay = document.createElement('div');
                overlay.className = 'image-overlay-hint';
                overlay.textContent = '🔍 Click to Preview';

                imgWrapper.appendChild(img);
                imgWrapper.appendChild(overlay);

                const cardContent = document.createElement('div');
                cardContent.className = 'card-content';

                const playerTitle = document.createElement('div');
                playerTitle.className = 'player-title';
                playerTitle.textContent = item.title;

                const nameHeader = document.createElement('h3');
                nameHeader.textContent = item.name;

                const locationTag = document.createElement('div');
                locationTag.className = 'location-tag';
                if (item.state && item.lga) {
                    locationTag.textContent = `📍 ${item.lga}, ${item.state}`;
                } else if (item.state) {
                    locationTag.textContent = `📍 ${item.state}`;
                }

                const actionBtns = document.createElement('div');
                actionBtns.className = 'action-btns';

                const waAnchor = document.createElement('a');
                waAnchor.href = waLink;
                waAnchor.target = '_blank';
                waAnchor.rel = 'noopener noreferrer';
                waAnchor.className = 'whatsapp-btn';
                waAnchor.innerHTML = `${whatsappSvg} Chat`;

                const callAnchor = document.createElement('a');
                callAnchor.href = callLink;
                callAnchor.className = 'call-btn';
                callAnchor.innerHTML = `${phoneSvg} Call`;

                actionBtns.appendChild(waAnchor);
                actionBtns.appendChild(callAnchor);

                cardContent.appendChild(playerTitle);
                cardContent.appendChild(nameHeader);
                if (item.state) cardContent.appendChild(locationTag);
                cardContent.appendChild(actionBtns);

                article.appendChild(imgWrapper);
                article.appendChild(cardContent);

                grid.appendChild(article);
            });
        }

        function checkAdminAccess() {
            if (isAdminLoggedIn) {
                openAdminDashboard();
            } else {
                document.getElementById('login-modal').classList.add('active');
            }
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === '0000') {
                isAdminLoggedIn = true;
                document.getElementById('logout-btn').style.display = 'inline-block';
                document.getElementById('admin-pass').value = '';
                closeModals();
                openAdminDashboard();
            } else {
                alert('Incorrect Admin Passcode!');
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            document.getElementById('logout-btn').style.display = 'none';
            alert('Logged out of Admin panel.');
        }

        function openAdminDashboard() {
            document.getElementById('admin-modal').classList.add('active');
            renderAdminManageList();
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
        }

        function renderAdminManageList() {
            const list = document.getElementById('admin-manage-list');
            list.innerHTML = '';
            
            galleryData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'admin-manage-item';

                const span = document.createElement('span');
                const locInfo = item.state ? ` - ${item.state}` : '';
                span.textContent = `${item.name} (${item.title}${locInfo})`;

                const actionDiv = document.createElement('div');
                actionDiv.className = 'admin-item-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn-edit';
                editBtn.innerHTML = `${editSvg} Edit`;
                editBtn.onclick = () => openEditModal(index);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerHTML = `${trashSvg} Delete`;
                deleteBtn.onclick = () => deleteMemberEntry(index);

                actionDiv.appendChild(editBtn);
                actionDiv.appendChild(deleteBtn);

                div.appendChild(span);
                div.appendChild(actionDiv);
                list.appendChild(div);
            });
        }

        function openEditModal(index) {
            const item = galleryData[index];
            
            document.getElementById('edit-preview-img').src = item.img;
            document.getElementById('edit-preview-name').textContent = item.name;

            document.getElementById('edit-row-id').value = item.rowId || '';
            document.getElementById('edit-index').value = index;
            document.getElementById('edit-file').value = ''; 
            document.getElementById('edit-name').value = item.name || '';
            document.getElementById('edit-title').value = item.title || '';
            document.getElementById('edit-phone').value = item.phone || '';

            const stateSelect = document.getElementById('edit-state');
            stateSelect.value = item.state || '';
            handleStateChange('edit-state', 'edit-lga-container', 'edit-lga');

            if (item.lga) {
                document.getElementById('edit-lga').value = item.lga;
            }

            document.getElementById('edit-modal').classList.add('active');
        }

        function previewNewEditImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('edit-preview-img').src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function saveMemberEdit() {
            const index = document.getElementById('edit-index').value;
            const rowId = document.getElementById('edit-row-id').value;
            const saveBtn = document.getElementById('save-edit-btn');
            const fileInput = document.getElementById('edit-file');

            const payload = {
                action: 'edit',
                rowId: rowId,
                existingImg: galleryData[index].img,
                name: document.getElementById('edit-name').value.trim(),
                title: document.getElementById('edit-title').value.trim(),
                phone: document.getElementById('edit-phone').value.trim(),
                state: document.getElementById('edit-state').value,
                lga: document.getElementById('edit-lga').value
            };

            saveBtn.disabled = true;
            saveBtn.textContent = "Saving...";

            const performSubmit = async (dataPayload) => {
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(dataPayload)
                    });

                    const res = await response.json();

                    if (res.status === 'success') {
                        galleryData[index].name = dataPayload.name;
                        galleryData[index].title = dataPayload.title;
                        galleryData[index].phone = dataPayload.phone;
                        galleryData[index].state = dataPayload.state;
                        galleryData[index].lga = dataPayload.lga;
                        if (res.imageUrl) {
                            galleryData[index].img = res.imageUrl;
                        }

                        applyLocationFilter();
                        renderAdminManageList();
                        closeEditModal();
                        alert('Updated successfully!');
                    } else {
                        alert('Failed to update: ' + res.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('Error updating details. Check browser console.');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = "Save Changes";
                }
            };

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    payload.bytes = e.target.result.split(',')[1];
                    payload.filename = file.name;
                    payload.mimeType = file.type;
                    performSubmit(payload);
                };
                reader.readAsDataURL(file);
            } else {
                performSubmit(payload);
            }
        }

        async function deleteMemberEntry(index) {
            const item = galleryData[index];
            if (!confirm(`Are you sure you want to permanently delete "${item.name}"?`)) {
                return;
            }

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'delete',
                        rowId: item.rowId
                    })
                });

                const res = await response.json();

                if (res.status === 'success') {
                    galleryData.splice(index, 1);
                    applyLocationFilter();
                    renderAdminManageList();
                    alert('Deleted successfully!');
                } else {
                    alert('Failed to delete: ' + res.message);
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred while deleting.');
            }
        }

        function previewImage(src, name) {
            const modal = document.getElementById('preview-modal');
            const img = document.getElementById('preview-img');
            const caption = document.getElementById('preview-caption');
            img.src = src;
            caption.textContent = name;
            modal.classList.add('active');
        }

        async function addPhotoEntry() {
            const fileInput = document.getElementById('input-file');
            const nameInput = document.getElementById('input-name');
            const titleInput = document.getElementById('input-title');
            const phoneInput = document.getElementById('input-phone');
            const stateInput = document.getElementById('input-state');
            const lgaInput = document.getElementById('input-lga');
            const publishBtn = document.getElementById('publish-btn');

            if (fileInput.files.length === 0 || !nameInput.value.trim() || !phoneInput.value.trim()) {
                alert('Please select an image file, enter a name, and provide a phone number!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            publishBtn.disabled = true;
            publishBtn.textContent = "Uploading...";

            reader.onload = async function(e) {
                const base64String = e.target.result.split(',')[1];
                
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    bytes: base64String,
                    name: nameInput.value.trim(),
                    title: titleInput.value.trim() || 'Member',
                    phone: phoneInput.value.trim(),
                    state: stateInput.value || '',
                    lga: lgaInput.value || ''
                };

                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (result.status === "success") {
                        galleryData.push(result.entry);
                        applyLocationFilter();
                        renderAdminManageList();

                        fileInput.value = '';
                        nameInput.value = '';
                        titleInput.value = '';
                        phoneInput.value = '';
                        stateInput.value = '';
                        lgaInput.value = '';
                        document.getElementById('lga-container').style.display = 'none';

                        alert('Success! Image and details published globally.');
                    } else {
                        alert('Upload failed: ' + result.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('An error occurred during upload.');
                } finally {
                    publishBtn.disabled = false;
                    publishBtn.textContent = "Publish to Album";
                }
            };

            reader.readAsDataURL(file);
        }

        // Initialize state dropdowns & fetch live data
        populateStateOptions('filter-state');
        populateStateOptions('input-state');
        populateStateOptions('edit-state');
        fetchGalleryData();



          </script>
</body>
</html>
