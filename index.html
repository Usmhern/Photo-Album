<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 2024 DIGITAL PHOTO ALBUM</title>
  
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpg" href="https://nacos.org.ng/img/about.jpg">
    <link rel="stylesheet" href="">
    <script src="">
    
    <style>
    </style>
</head>
<body class="intro-active">

    <!-- Splash Intro Screen -->
    <div id="intro-overlay" aria-hidden="false">
        <div class="intro-inner" role="dialog">
            <div class="intro-logo">
                <img src="https://nacos.org.ng/img/about.jpg" alt="NACOS Logo">
            </div>

            <div class="intro-texts">
                <div id="line-1" class="intro-line"></div>
                <div id="line-2" class="intro-line"></div>
                <div id="line-3" class="intro-line"></div>
                <div id="line-4" class="intro-line"></div>
                <div id="line-5" class="intro-line" dir="rtl"></div>
            </div>

            <button id="enter-btn" class="btn" style="display:none;">Open Album</button>

            <audio id="welcomeSound" preload="auto">
                <source src="https://raw.githubusercontent.com/Usmhern/Photo-Album/main/win7.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <!-- Floating Live Chat Button with WhatsApp Icon & Unread Counter Badge -->
    <button class="floating-chat-btn" onclick="openLiveChat()">
        <svg style="width: 22px; height: 22px; fill: currentColor;" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
        <span>Live Chat</span>
        <span class="unread-badge" id="unread-count-badge">0</span>
    </button>

    <!-- Album Header -->
    <header class="album-header">
        <div class="nacos-logo-container" title="Nigeria Association of Computer Science Students">
            <img src="https://nacos.org.ng/img/about.jpg" alt="NACOS Logo" class="nacos-logo-img">
        </div>
        <h1><span id="glowtt" style="color:#0be;">YOBE STATE UNIVERSITY</span></h1>
        <h3>CS <span style="color:#e20" id="glowt2">2K24</span> DIGITAL PHOTO ALBUM</h3>
    </header>

    <div class="admin-bar">
        <button class="btn btn-chat" onclick="openLiveChat()">💬 Member Live Chat</button>
        <button id="Lock" class="btn btn-primary" onclick="checkAdminAccess()" style="display:none;">Central Admin Panel</button>
        <button class="btn" id="logout-btn" style="display:none;" onclick="adminLogout()">Logout Admin</button>
    </div>

    <!-- Filter Bar -->
    <section class="search-filter-container">
        <div class="filter-group">
            <select id="filter-state" onchange="onFilterStateChange()">
                <option value="">STATE</option>
            </select>
        </div>

        <div class="filter-group">
            <select id="filter-lga" onchange="applyLocationFilter()" disabled>
                <option value="">LGA</option>
            </select>
        </div>

        <div style="text-align: center;">
            <button class="btn btn-reset" onclick="resetFilters()" style="background:#e20; color:#fff;">🔍 ALL</button>
        </div>
    </section>

    <!-- Gallery Container -->
    <main class="gallery-container" id="gallery-grid">
        <div class="loading-text">Loading album memories...</div>
    </main>

    <!-- Modals Section -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Admin Authentication</h2>
            <div class="form-group">
                <label for="admin-pass">Admin Passcode</label>
                <input type="password" id="admin-pass" placeholder="Enter code">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <!-- Chat Phone Verification Modal -->
    <div id="chat-auth-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Member Verification</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                Please enter your registered phone number to join the class live chat:
            </p>
            <div class="form-group">
                <label for="chat-phone-input">Phone Number</label>
                <input type="tel" id="chat-phone-input" placeholder="e.g. 08012345678">
            </div>
            <button class="btn btn-chat" style="width:100%; font-weight: bold;" onclick="verifyChatPhone()">Access Live Chat</button>
        </div>
    </div>

    <!-- Live Chat Room Modal -->
    <div id="live-chat-modal" class="modal">
        <div class="modal-content chat-modal-content" id="chat-window-wrapper" data-chat-theme="dark">
            <button class="close-modal" style="top: 0.8rem; right: 1rem; z-index:10;" onclick="closeModals()">&times;</button>
            
            <div class="chat-header">
                <div>
                    <h2 style="margin: 0; font-size: 1.1rem; color: var(--chat-text);">CS 2K24 GROUP CHAT</h2>
                    <span id="chat-user-badge" style="font-size: 0.78rem; opacity: 0.8;">Logged in as Member</span>
                </div>
                <!-- Theme Switcher Button -->
                <button class="btn" style="padding: 4px 10px; font-size: 0.8rem; margin-right: 30px;" onclick="toggleChatTheme()" id="theme-toggle-btn" title="Toggle Dark/Light Theme">☀️ Light</button>
            </div>

            <!-- Active / Online Members Status Bar with Green Circle -->
            <div class="online-members-bar" id="online-members-bar">
                <span class="online-green-circle"></span> <strong id="online-count-text">Online (0):</strong> <span id="online-users-list">Checking active members...</span>
            </div>

            <!-- Chat Messages Window -->
            <div class="chat-messages" id="chat-messages-container">
                <div class="loading-text">Loading chat messages...</div>
            </div>

            <!-- Mention Auto-Complete Dropdown Menu -->
            <div class="mention-dropdown" id="mention-dropdown"></div>

            <!-- Hidden File / Photo Input for Uploads -->
            <input type="file" id="chat-file-input" style="display: none;" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleChatFileUpload(this)">

            <!-- Chat Message Input Bar -->
            <div class="chat-input-area">
                <!-- Recording Animation Indicator -->
                <div class="voice-recording-indicator" id="recording-indicator">
                    <span class="recording-dot"></span> Recording Voice Note... <span id="recording-timer">0s</span>
                </div>

                <!-- Attachment / Upload Button -->
                <button class="chat-tool-btn" title="Upload Photo or File" onclick="document.getElementById('chat-file-input').click()">📎</button>

                <!-- Voice-to-Text Speech Recognition Button -->
                <button class="chat-tool-btn" id="speech-to-text-btn" title="Speech to Text (Voice typing)" onclick="toggleSpeechToText()">🗣️</button>

                <input type="text" id="chat-msg-input" placeholder="Type a message... (Type @ to mention)" oninput="handleMentionInput(event)" onkeypress="handleChatKeyPress(event)">
                
                <!-- Voice Note Recording Button -->
                <button class="chat-tool-btn" id="voice-record-btn" title="Record Voice Note" onclick="toggleVoiceNoteRecording()">🎙️</button>
                
                <!-- Responsive Send Button -->
                <button class="send-msg-btn-custom" id="send-msg-btn" title="Send message" onclick="sendChatMessage()">
                    <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <h2>Central Admin Dashboard</h2>

            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem;">
                <h3 style="font-size: 1.1rem; margin-bottom: 0.75rem;">Add New Memory / Member</h3>
                <div class="form-group">
                    <label for="input-file">Upload Picture from Device</label>
                    <input type="file" id="input-file" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="input-name">Person's Name</label>
                    <input type="text" id="input-name" placeholder="e.g. name">
                </div>
                <div class="form-group">
                    <label for="input-title">Nickname</label>
                    <input type="text" id="input-title" placeholder="e.g. Engr.">
                </div>
                <div class="form-group">
                    <label for="input-phone">WhatsApp/Phone Number</label>
                    <input type="text" id="input-phone" placeholder="e.g. 08012345678">
                </div>
                <div class="form-group">
                    <label for="input-state">Select State</label>
                    <select id="input-state" onchange="handleStateChange('input-state', 'lga-container', 'input-lga')">
                        <option value="">-- Choose State --</option>
                    </select>
                </div>
                <div class="form-group" id="lga-container" style="display:none;">
                    <label for="input-lga">Select Local Government Area (LGA)</label>
                    <select id="input-lga">
                        <option value="">-- Choose LGA --</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="publish-btn" onclick="addPhotoEntry()">Publish to Album</button>
            </div>

            <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Existing Entries (Manage & Edit)</h3>
            <div id="admin-manage-list" style="max-height: 250px; overflow-y: auto;"></div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
            <h2>Edit Member Information</h2>

            <div class="edit-preview-box" style="text-align: center; margin-bottom: 1rem;">
                <img id="edit-preview-img" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;" src="" alt="Member Image">
                <div id="edit-preview-name" style="font-weight: 700; color: var(--text-main); margin-top: 0.5rem;"></div>
            </div>

            <input type="hidden" id="edit-row-id">
            <input type="hidden" id="edit-index">

            <div class="form-group">
                <label for="edit-file">Replace Member Photo (Optional)</label>
                <input type="file" id="edit-file" accept="image/*" onchange="previewNewEditImage(this)">
            </div>
            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label for="edit-title">Nickname</label>
                <input type="text" id="edit-title">
            </div>
            <div class="form-group">
                <label for="edit-phone">Phone Number</label>
                <input type="text" id="edit-phone">
            </div>
            <div class="form-group">
                <label for="edit-state">State</label>
                <select id="edit-state" onchange="handleStateChange('edit-state', 'edit-lga-container', 'edit-lga')">
                    <option value="">-- Choose State --</option>
                </select>
            </div>
            <div class="form-group" id="edit-lga-container" style="display:none;">
                <label for="edit-lga">LGA</label>
                <select id="edit-lga">
                    <option value="">-- Choose LGA --</option>
                </select>
            </div>

            <button class="btn btn-primary" id="save-edit-btn" style="width:100%;" onclick="saveMemberEdit()">Save Changes</button>
        </div>
    </div>

    <div id="preview-modal" class="modal" onclick="closeModals()">
        <div class="preview-modal-content" onclick="event.stopPropagation()">
            <audio id="BSound" preload="auto">
                <source src="https://raw.githubusercontent.com/Usmhern/Photo-Album/main/hw.mp3" type="audio/mpeg">
            </audio>
            <button class="close-modal" onclick="closeModals()">&times;</button>
            <img id="preview-img" src="" alt="Preview">
            <div id="preview-caption" class="preview-caption"></div>
        </div>
    </div>

    <!-- Application Scripting -->
    <script>
      </script>
</body>
</html>
