<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Class of 2023 | Digital Photo Album</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f0f0f; color: white; overflow-x: hidden; }
        
        /* Animated Gradient Header */
        .header {
            height: 350px;
            background: linear-gradient(-45deg, #23a6d5, #23d5ab, #e73c7e, #ee7752);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        .logo { width: 100px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); margin-bottom: 15px; }
        h1 { font-size: 1.8rem; letter-spacing: 2px; margin: 0 10px; text-transform: uppercase; }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s ease;
            border: 1px solid #333;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); }
        .card img { width: 100%; height: 280px; object-fit: cover; cursor: pointer; }

        .card-info { padding: 15px; display: flex; justify-content: space-around; background: #222; }
        .card-info i { font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .fa-whatsapp { color: #25D366; }
        .fa-phone { color: #34b7f1; }
        .card-info i:hover { transform: scale(1.2); }

        /* Modal Details */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a1a; margin: 10% auto; padding: 30px; width: 85%; max-width: 450px; border-radius: 20px; border: 2px solid var(--primary); position: relative; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from {transform: translateY(-50px); opacity: 0;} to {transform: translateY(0); opacity: 1;} }
        .close { position: absolute; right: 20px; top: 10px; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://via.placeholder.com/100" alt="Logo" class="logo"> <h1>CS CLASS OF 2023<br>DIGITAL PHOTO ALBUM</h1>
    </div>

    <div id="photoGrid" class="grid">
        </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="m-name" style="color: var(--primary);"></h2>
            <p><strong>Nickname:</strong> <span id="m-nick"></span></p>
            <p><strong>State:</strong> <span id="m-state"></span></p>
            <p><strong>LGA:</strong> <span id="m-lga"></span></p>
            <p><strong>Address:</strong> <span id="m-address"></span></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC92Yqng7OXblKO7WHwrnW9obXj4qiq1eo",
            authDomain: "toonz-70b08.firebaseapp.com",
            projectId: "toonz-70b08",
            storageBucket: "toonz-70b08.firebasestorage.app",
            messagingSenderId: "1007180452941",
            appId: "1:1007180452941:web:195aa7a4e458550425b804",
            measurementId: "G-SP2TXPXR79"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const grid = document.getElementById('photoGrid');

        // Get Data (Automatic Updates)
        onSnapshot(query(collection(db, "students"), orderBy("timestamp", "desc")), (snapshot) => {
            grid.innerHTML = "";
            snapshot.forEach((doc) => {
                const s = doc.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${s.imageUrl}" onclick="openModal('${s.name}', '${s.nickname}', '${s.state}', '${s.lga}', '${s.address}')">
                    <div class="card-info">
                        <i class="fab fa-whatsapp" onclick="sendWA('${s.phone}', '${s.name}')"></i>
                        <a href="tel:${s.phone}"><i class="fas fa-phone"></i></a>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // WhatsApp Logic
        window.sendWA = (phone, name) => {
            const msg = encodeURIComponent(`Assalam Alaikum ${name},`);
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        };

        // Modal Logic
        const modal = document.getElementById("detailModal");
        window.openModal = (name, nick, state, lga, addr) => {
            document.getElementById('m-name').innerText = name;
            document.getElementById('m-nick').innerText = nick;
            document.getElementById('m-state').innerText = state;
            document.getElementById('m-lga').innerText = lga;
            document.getElementById('m-address').innerText = addr;
            modal.style.display = "block";
        };

        document.querySelector('.close').onclick = () => modal.style.display = "none";
        window.onclick = (event) => { if(event.target == modal) modal.style.display = "none"; }
    </script>
</body>
</html>
